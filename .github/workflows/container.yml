name: deploy-container

on:
  push:
    branches:
      - main
    paths:
      - "packages/container/**"

defaults:
  run:
    working-directory: packages/container

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: action/checkout@2
      - run: npm install
      - run: npm run build
        env:
          PRODUCTION_DOMAIN: ${{secrete.PRODUCTION_DOMAIN}}

      - uses: shinyinc/action-aws-cli@v1.2
      - run: aws s3 sync dist s3://${{ secret.AWS_S3_BUCKET_NAME }}/container/latest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secret.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: REPLACE_WITH_YOUR_REGION
      - run: aws cloudfront create-invalidation --distribution-id ${{ secret.AWS_DISTRIBUTION_ID }} --path "/container/latest/index/html"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secret.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: REPLACE_WITH_YOUR_REGION